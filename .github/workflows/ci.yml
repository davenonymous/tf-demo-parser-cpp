#
# Every push, pull request and manual run: formatting and clang-tidy, the
# build and tests on Linux (x86_64 with gcc and clang, x86), Windows (MSVC
# x64) and macOS (arm64) with the test data, the tests under AddressSanitizer
# and UndefinedBehaviorSanitizer, a short run of each fuzzer, the
# differential tests against tf-demo-parser 0.7.2, and the ways to consume
# the library (find_package, FetchContent, pkg-config, vcpkg, Conan). Every
# platform packs an install as an archive. A pushed v* tag also publishes a
# GitHub release with them, the source tarball and SHA256SUMS, after
# checking that the tag is the version of include/tfdemo/version.hpp; its
# notes are the version's section of CHANGELOG.md.
#
# The test data is the asset of the test-data-2 release (tests/data/README.md),
# cached between runs under its SHA-256 (TFDEMO_TEST_DATA_SHA256 in
# tests/CMakeLists.txt). Every action is pinned to a commit, its version in
# the comment; Dependabot updates them.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TFDEMO_TEST_DATA_DIR: ${{ github.workspace }}/.test-data
  JSONSCHEMA_VERSION: '4.23.0'

jobs:
  format:
    name: Format (clang-format 18)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Check the formatting
        run: |
          git ls-files '*.cpp' '*.hpp' '*.h' '*.c' | xargs clang-format-18 --dry-run --Werror

  tidy:
    name: clang-tidy 18
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-18 clang-tidy-18 ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run clang-tidy
        run: run-clang-tidy-18 -p build -quiet -j "$(nproc)" "$PWD/(src|tools|tests|fuzz)/.*"

  build:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-gcc
            os: ubuntu-24.04
            preset: release
            cc: gcc
            cxx: g++
            package: linux-x86_64
          - name: linux-x86_64-gcc-11
            os: ubuntu-22.04
            preset: release
            cc: gcc-11
            cxx: g++-11
          - name: linux-x86_64-clang
            os: ubuntu-24.04
            preset: release
            cc: clang-18
            cxx: clang++-18
          - name: linux-x86
            os: ubuntu-24.04
            preset: x86
            cc: gcc
            cxx: g++
            multilib: true
            package: linux-x86
          - name: windows-x64
            os: windows-2022
            preset: release
            generator: Visual Studio 17 2022
            package: windows-x64
          - name: macos-arm64
            os: macos-14
            preset: release
            package: macos-arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the 32-bit toolchain
        if: matrix.multilib
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-multilib g++-multilib
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: '3.12'
      - name: Install jsonschema
        run: python -m pip install "jsonschema==${JSONSCHEMA_VERSION}"
      - name: Find the test data's SHA-256
        id: test-data
        run: |
          sha256="$(sed -n 's/^set(TFDEMO_TEST_DATA_SHA256 \([0-9a-f]\{64\}\))$/\1/p' tests/CMakeLists.txt)"
          if [ -z "${sha256}" ]; then
            echo "tests/CMakeLists.txt sets no TFDEMO_TEST_DATA_SHA256" >&2
            exit 1
          fi
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"
      - name: Cache the test data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .test-data
          key: tfdemo-test-data-${{ steps.test-data.outputs.sha256 }}
      - name: Configure
        run: |
          args=(--preset "${{ matrix.preset }}" "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}"
            "-DTFDEMO_TEST_DATA_DIR=${TFDEMO_TEST_DATA_DIR}")
          if [ -n "${{ matrix.generator }}" ]; then args+=(-G "${{ matrix.generator }}" -A x64); fi
          if [ -n "${{ matrix.cc }}" ]; then args+=("-DCMAKE_C_COMPILER=${{ matrix.cc }}" "-DCMAKE_CXX_COMPILER=${{ matrix.cxx }}"); fi
          cmake "${args[@]}"
      - name: Build
        run: cmake --build "build/${{ matrix.preset }}" --config Release --parallel
      - name: Test
        run: ctest --test-dir "build/${{ matrix.preset }}" -C Release --output-on-failure
      - name: Pack the install
        if: matrix.package
        run: |
          version="$(scripts/version.sh)"
          name="tf-demo-parser-cpp-${version}-${{ matrix.package }}"
          cmake --install "build/${{ matrix.preset }}" --config Release --prefix "stage/${name}"
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd stage && 7z a -tzip "../dist/${name}.zip" "${name}" >/dev/null)
          else
            tar -C stage -czf "dist/${name}.tar.gz" "${name}"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.package
        with:
          name: package-${{ matrix.package }}
          path: dist/*
          if-no-files-found: error

  sanitize:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev ninja-build
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: '3.12'
      - name: Install jsonschema
        run: python -m pip install "jsonschema==${JSONSCHEMA_VERSION}"
      - name: Find the test data's SHA-256
        id: test-data
        run: |
          sha256="$(sed -n 's/^set(TFDEMO_TEST_DATA_SHA256 \([0-9a-f]\{64\}\))$/\1/p' tests/CMakeLists.txt)"
          if [ -z "${sha256}" ]; then
            echo "tests/CMakeLists.txt sets no TFDEMO_TEST_DATA_SHA256" >&2
            exit 1
          fi
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"
      - name: Cache the test data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .test-data
          key: tfdemo-test-data-${{ steps.test-data.outputs.sha256 }}
      - name: Configure
        run: >
          cmake --preset sanitize -G Ninja -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}" "-DTFDEMO_TEST_DATA_DIR=${TFDEMO_TEST_DATA_DIR}"
      - name: Build
        run: cmake --build --preset sanitize
      - name: Test
        run: ctest --preset sanitize

  fuzz:
    name: Fuzz (libFuzzer, 60 seconds each)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev ninja-build
      - name: Build the fuzzers
        run: |
          cmake --preset fuzz -G Ninja -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build --preset fuzz
      - name: Run the fuzzers
        run: |
          mkdir -p findings
          python3 fuzz/make_corpus.py tests/data/client-start.dem corpus
          build/fuzz/fuzz/demo_fuzzer -max_total_time=60 -artifact_prefix=findings/ corpus/demo
          build/fuzz/fuzz/messages_fuzzer -max_total_time=60 -artifact_prefix=findings/ corpus/messages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fuzz-findings
          path: findings/

  differential:
    name: Differential (tf-demo-parser 0.7.2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/parse_demo
            tests/differential/dump_entities/target
          key: cargo-${{ hashFiles('tests/differential/dump_entities/Cargo.lock') }}-tf-demo-parser-0.7.2
      - name: Build tf-demo-parser's parse_demo and dump_entities
        run: |
          if [ ! -x ~/.cargo/bin/parse_demo ]; then
            cargo install tf-demo-parser --version =0.7.2 --locked --bin parse_demo
          fi
          cargo build --release --locked --manifest-path tests/differential/dump_entities/Cargo.toml
      - name: Find the test data's SHA-256
        id: test-data
        run: |
          sha256="$(sed -n 's/^set(TFDEMO_TEST_DATA_SHA256 \([0-9a-f]\{64\}\))$/\1/p' tests/CMakeLists.txt)"
          if [ -z "${sha256}" ]; then
            echo "tests/CMakeLists.txt sets no TFDEMO_TEST_DATA_SHA256" >&2
            exit 1
          fi
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"
      - name: Cache the test data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .test-data
          key: tfdemo-test-data-${{ steps.test-data.outputs.sha256 }}
      - name: Build tfdemo
        run: |
          cmake --preset release "-DTFDEMO_TEST_DATA_DIR=${TFDEMO_TEST_DATA_DIR}" -DTFDEMO_BUILD_TESTS=ON
          cmake --build --preset release --target tfdemo_cli
      - name: Compare
        run: |
          demo="${TFDEMO_TEST_DATA_DIR}/${{ steps.test-data.outputs.sha256 }}/demos/process-6v6.dem"
          python3 tests/differential/compare_summary.py build/release/tfdemo ~/.cargo/bin/parse_demo "${demo}"
          for tick in 2000 60000 110000; do
            python3 tests/differential/compare_entities.py build/release/tfdemo \
              tests/differential/dump_entities/target/release/dump_entities "${demo}" "${tick}"
          done

  consumers:
    name: Consumers (find_package, FetchContent, pkg-config, vcpkg, Conan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install
        run: |
          cmake -S . -B build -DTFDEMO_BUILD_TESTS=OFF
          cmake --build build --parallel
          cmake --install build --prefix "$PWD/prefix"
      - name: find_package
        run: |
          cmake -S tests/consumer -B consumer-find -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build consumer-find
          consumer-find/consumer
          LD_LIBRARY_PATH="$PWD/prefix/lib" consumer-find/consumer_c
      - name: FetchContent
        run: |
          cmake -S tests/consumer -B consumer-fetch -DCONSUMER_FETCH=ON -DTFDEMO_SOURCE_DIR="$PWD"
          cmake --build consumer-fetch --parallel
          consumer-fetch/consumer
      - name: pkg-config
        run: |
          export PKG_CONFIG_PATH="$PWD/prefix/lib/pkgconfig"
          read -r -a cpp_flags <<< "$(pkg-config --cflags --libs tfdemo-cpp)"
          read -r -a c_flags <<< "$(pkg-config --cflags --libs tfdemo)"
          g++ -std=c++17 tests/consumer/consumer.cpp "${cpp_flags[@]}" -o consumer-pc
          ./consumer-pc
          gcc tests/consumer/consumer.c "${c_flags[@]}" -o consumer-pc-c
          LD_LIBRARY_PATH="$PWD/prefix/lib" ./consumer-pc-c
      - name: vcpkg (overlay port)
        run: |
          "${VCPKG_INSTALLATION_ROOT}/vcpkg" install --overlay-ports=ports tfdemo --x-install-root="$PWD/vcpkg-installed"
          cmake -S tests/consumer -B consumer-vcpkg \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$PWD/vcpkg-installed"
          cmake --build consumer-vcpkg
          consumer-vcpkg/consumer
          consumer-vcpkg/consumer_c
      - name: Conan
        run: |
          python3 -m pip install --user "conan>=2,<3"
          conan profile detect
          conan create . --build=missing
          conan create . --build=missing -o "tfdemo/*:shared=True"

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [format, tidy, build, sanitize, fuzz, differential, consumers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check the tag against the version
        run: |
          version="$(scripts/version.sh)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "the tag ${GITHUB_REF_NAME} is not v${version} of include/tfdemo/version.hpp" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "${GITHUB_ENV}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Source tarball, checksums and notes
        run: |
          scripts/source-tarball.sh "${GITHUB_REF_NAME}" dist
          (cd dist && sha256sum -- * > SHA256SUMS)
          scripts/changelog-section.sh "${VERSION}" > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag
          --title "tf-demo-parser-cpp ${VERSION}" --notes-file notes.md
